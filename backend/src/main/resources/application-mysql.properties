# MySQL profile 配置（兜底方案）
# 使用方式：启动时追加参数 --spring.profiles.active=mysql，并执行 database/import-mysql.sql
# 业务代码（实体 / Repository / 查询）零改动，仅切换数据源即可。
server.port=8080
server.servlet.context-path=/api

spring.datasource.url=jdbc:mysql://localhost:3306/ecommerce_dashboard?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&allowLoadLocalInfile=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false

import.csv-path=archive/

datarule.sales-growth-strong=10
datarule.sales-growth-decline=-10
datarule.repurchase-low=20
datarule.review-low=3.5
datarule.review-high=4.2
datarule.delay-high=15
datarule.cancel-high=5
datarule.alert-category-drop=30
datarule.alert-score-drop=0.5
datarule.alert-payment-shift=10

app.auth.token-header=X-Token

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

cors.allowed-origins=*
cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
cors.allowed-headers=*
