server.port=8080
server.servlet.context-path=/api

# ===== 默认数据源：H2 文件库（真实数据库，满足课程「导入数据库」红线）=====
# 数据真实落库到 ./data/dashboard.mv.db，由 DatabaseInitializer 通过 CSVREAD 自举导入 archive/*.csv
spring.datasource.url=jdbc:h2:file:./data/dashboard;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
# 表结构由 schema.sql 显式创建，Hibernate 不再自动建表
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
# 建表 SQL 由 DatabaseInitializer 在启动时执行，这里关闭自动初始化避免冲突
spring.sql.init.mode=never

# ===== CSV 自举导入路径（部署时可改成绝对路径；默认 archive/，相对 backend 启动时回退 ../archive/）=====
import.csv-path=archive/

# ===== 规则引擎阈值（diagnosis / signals / alerts 共用，答辩时可现场调）=====
datarule.sales-growth-strong=10
datarule.sales-growth-decline=-10
datarule.repurchase-low=20
datarule.review-low=3.5
datarule.review-high=4.2
datarule.delay-high=15
datarule.cancel-high=5
datarule.alert-category-drop=30
datarule.alert-score-drop=0.5
datarule.alert-payment-shift=10
# 评分环比预警的最小评论数（两期均需达到）：低于此值的品类评分波动视为小样本噪声不报
datarule.alert-score-drop-min-reviews=20
# 品类骤降预警的“上期绝对额”下限(万 R$)：上期销售额不超过此值的小额品类波动不报，避免无意义红色预警
# （1.0 万 R$ 可滤除圣诞用品/内衣泳装/集市/男装等月均不足 1500 R$ 的边缘品类；0.5 万时圣诞用品恰在边界会漏过）
datarule.alert-category-drop-min-sales=1.0

# ===== 登录（轻量真实校验：BCrypt 哈希 + 内存 token）=====
app.auth.token-header=X-Token

# Swagger / OpenAPI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# 跨域（前端原生 JS fetch 直接调用）
cors.allowed-origins=*
cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
cors.allowed-headers=*
